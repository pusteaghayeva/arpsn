<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="100%" height="100%">
  <defs>
    <linearGradient id="asanCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
    <linearGradient id="asanRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>
    <linearGradient id="asanGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00A844"/>
    </linearGradient>
  </defs>

  <!-- ASAN Xidmət Peacock / Ribbon Brand Emblem -->
  <g transform="translate(10, 8)">
    <!-- Cyan upper loop -->
    <path d="M 24 4 C 36 4, 46 14, 46 26 C 46 36, 38 44, 28 46 C 28 38, 34 32, 34 26 C 34 20, 29 15, 23 15 C 17 15, 13 19, 12 25 C 9 20, 15 4, 24 4 Z" fill="url(#asanCyan)"/>
    <!-- Red middle core -->
    <path d="M 20 18 C 26 18, 30 22, 30 28 C 30 33, 26 38, 20 40 C 16 40, 13 37, 13 33 C 13 28, 17 24, 21 24 C 23 24, 25 25, 25 27 C 25 29, 23 30, 21 30 C 19 30, 18 29, 18 28 C 18 25, 17 21, 20 18 Z" fill="url(#asanRed)"/>
    <!-- Green base curve -->
    <path d="M 8 28 C 10 24, 15 22, 18 25 C 16 32, 12 40, 18 48 C 24 54, 34 52, 40 48 C 42 53, 34 58, 24 56 C 14 54, 4 44, 8 28 Z" fill="url(#asanGreen)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(74, 42)">
    <text font-family="'Outfit', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#082B48" letter-spacing="-0.5">ASAN</text>
    <text x="82" y="0" font-family="'Outfit', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="21" fill="#0080FF" letter-spacing="0.5">xidmət</text>
  </g>
</svg>

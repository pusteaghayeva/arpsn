<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Turquoise Glaze Gradient (Möminə Xatun kaşısı) -->
    <linearGradient id="turquoiseGlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5C9"/>
      <stop offset="40%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#028090"/>
    </linearGradient>

    <!-- Golden Brick Gradient (Naxçıvan bişmiş kərpici) -->
    <linearGradient id="brickGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378"/>
      <stop offset="50%" stop-color="#B99755"/>
      <stop offset="100%" stop-color="#8C6826"/>
    </linearGradient>

    <!-- Terracotta Brick Tone -->
    <linearGradient id="terracottaTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C28250"/>
      <stop offset="100%" stop-color="#8C4A26"/>
    </linearGradient>

    <!-- Sketch Line Glow -->
    <filter id="sketchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A896" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(250, 250)">
    <!-- Architectural Draft Construction Circles (Eskiz xətləri) -->
    <circle r="235" fill="none" stroke="#B99755" stroke-width="0.75" stroke-dasharray="4,8" opacity="0.35"/>
    <circle r="215" fill="none" stroke="#00A896" stroke-width="0.75" opacity="0.25"/>
    <circle r="175" fill="none" stroke="#B99755" stroke-width="0.8" stroke-dasharray="2,6" opacity="0.4"/>
    <circle r="120" fill="none" stroke="#B99755" stroke-width="0.75" opacity="0.3"/>
    <circle r="60" fill="none" stroke="#00A896" stroke-width="1" opacity="0.35"/>

    <!-- Diagonal and Radial Construction Sketch Rays -->
    <g stroke="#B99755" stroke-width="0.6" opacity="0.25">
      <line x1="-240" y1="0" x2="240" y2="0"/>
      <line x1="0" y1="-240" x2="0" y2="240"/>
      <line x1="-170" y1="-170" x2="170" y2="170"/>
      <line x1="-170" y1="170" x2="170" y2="-170"/>
      <line x1="-221" y1="-91" x2="221" y2="91"/>
      <line x1="-91" y1="-221" x2="91" y2="221"/>
      <line x1="-221" y1="91" x2="221" y2="-91"/>
      <line x1="-91" y1="221" x2="91" y2="-221"/>
    </g>

    <!-- Outer Octagonal Girih Framework (Kərpic hörgü çərçivəsi) -->
    <polygon points="
      0,-225 86,-207 159,-159 207,-86 225,0 207,86 159,159 86,207
      0,225 -86,207 -159,159 -207,86 -225,0 -207,-86 -159,-159 -86,-207"
      fill="none" stroke="url(#brickGold)" stroke-width="2.5" opacity="0.7"/>

    <!-- 10 Signature Turquoise Glazed Tile Insets (Firuzəyi Kaşılar) -->
    <!-- Positioned radially matching the Momine Khatun photo -->
    <g id="turquoiseTiles" filter="url(#sketchGlow)">
      <!-- 8 Radial Turquoise Glazed Ribbons / Tiles -->
      <g transform="rotate(0)">
        <rect x="-7" y="-178" width="14" height="42" rx="3" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="-4" y1="-157" x2="4" y2="-157" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
      </g>
      <g transform="rotate(45)">
        <rect x="-7" y="-178" width="14" height="42" rx="3" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="-4" y1="-157" x2="4" y2="-157" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
      </g>
      <g transform="rotate(90)">
        <rect x="-7" y="-178" width="14" height="42" rx="3" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="-4" y1="-157" x2="4" y2="-157" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
      </g>
      <g transform="rotate(135)">
        <rect x="-7" y="-178" width="14" height="42" rx="3" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="-4" y1="-157" x2="4" y2="-157" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
      </g>
      <g transform="rotate(180)">
        <rect x="-7" y="-178" width="14" height="42" rx="3" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="-4" y1="-157" x2="4" y2="-157" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
      </g>
      <g transform="rotate(225)">
        <rect x="-7" y="-178" width="14" height="42" rx="3" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="-4" y1="-157" x2="4" y2="-157" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
      </g>
      <g transform="rotate(270)">
        <rect x="-7" y="-178" width="14" height="42" rx="3" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="-4" y1="-157" x2="4" y2="-157" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
      </g>
      <g transform="rotate(315)">
        <rect x="-7" y="-178" width="14" height="42" rx="3" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="-4" y1="-157" x2="4" y2="-157" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
      </g>

      <!-- Inner Turquoise Accent Diamonds (Daxili firuzə romblar) -->
      <g transform="rotate(22.5)">
        <polygon points="0,-108 8,-98 0,-88 -8,-98" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="0.8"/>
      </g>
      <g transform="rotate(67.5)">
        <polygon points="0,-108 8,-98 0,-88 -8,-98" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="0.8"/>
      </g>
      <g transform="rotate(112.5)">
        <polygon points="0,-108 8,-98 0,-88 -8,-98" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="0.8"/>
      </g>
      <g transform="rotate(157.5)">
        <polygon points="0,-108 8,-98 0,-88 -8,-98" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="0.8"/>
      </g>
      <g transform="rotate(202.5)">
        <polygon points="0,-108 8,-98 0,-88 -8,-98" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="0.8"/>
      </g>
      <g transform="rotate(247.5)">
        <polygon points="0,-108 8,-98 0,-88 -8,-98" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="0.8"/>
      </g>
      <g transform="rotate(292.5)">
        <polygon points="0,-108 8,-98 0,-88 -8,-98" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="0.8"/>
      </g>
      <g transform="rotate(337.5)">
        <polygon points="0,-108 8,-98 0,-88 -8,-98" fill="url(#turquoiseGlaze)" stroke="#ffffff" stroke-width="0.8"/>
      </g>
    </g>

    <!-- Interlacing Brick Girih Strapwork (Qızılı kərpic həndəsi naxış zolaqları) -->
    <!-- Star 1 (0 deg) -->
    <polygon points="
      0,-155 45,-109 109,-109 109,-45 155,0 109,45 109,109 45,109
      0,155 -45,109 -109,109 -109,45 -155,0 -109,-45 -109,-109 -45,-109"
      fill="none" stroke="url(#brickGold)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Star 2 (22.5 deg rotation) -->
    <g transform="rotate(22.5)">
      <polygon points="
        0,-155 45,-109 109,-109 109,-45 155,0 109,45 109,109 45,109
        0,155 -45,109 -109,109 -109,45 -155,0 -109,-45 -109,-109 -45,-109"
        fill="none" stroke="url(#terracottaTone)" stroke-width="3.5" stroke-linejoin="round" opacity="0.85"/>
    </g>

    <!-- Star 3 (45 deg rotation) -->
    <g transform="rotate(45)">
      <polygon points="
        0,-155 45,-109 109,-109 109,-45 155,0 109,45 109,109 45,109
        0,155 -45,109 -109,109 -109,45 -155,0 -109,-45 -109,-109 -45,-109"
        fill="none" stroke="url(#brickGold)" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- Intermediate Interlacing Knots and Rhombs (Həndəsi düyünlər) -->
    <g stroke="url(#brickGold)" stroke-width="2.5" fill="none">
      <path d="M-60,-145 L0,-85 L60,-145"/>
      <path d="M145,-60 L85,0 L145,60"/>
      <path d="M60,145 L0,85 L-60,145"/>
      <path d="M-145,60 L-85,0 L-145,-60"/>
    </g>

    <!-- Central 8-Pointed Core Star (Mərkəzi səkkizguşəli ulduz) -->
    <g fill="rgba(185, 151, 85, 0.08)" stroke="url(#brickGold)" stroke-width="3">
      <polygon points="0,-68 20,-20 68,0 20,20 0,68 -20,20 -68,0 -20,-20"/>
      <polygon points="0,-68 20,-20 68,0 20,20 0,68 -20,20 -68,0 -20,-20" transform="rotate(45)"/>
    </g>

    <!-- Stylized Kufic Monogram at the Absolute Center (Mərkəzdə Kufi kompozisiyası) -->
    <g fill="none" stroke="url(#brickGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- Central vertical stem -->
      <line x1="0" y1="-26" x2="0" y2="24"/>
      <line x1="-8" y1="-22" x2="-8" y2="18"/>
      <line x1="8" y1="-22" x2="8" y2="18"/>
      <!-- Crossbars and base geometric arches -->
      <path d="M-16,14 L-8,22 L8,22 L16,14"/>
      <path d="M-14,-10 L-8,-16 L0,-16 L8,-16 L14,-10"/>
      <!-- Dot accents in turquoise -->
      <circle cx="0" cy="-30" r="2.5" fill="#00A896" stroke="none"/>
      <circle cx="-16" cy="6" r="2" fill="#00A896" stroke="none"/>
      <circle cx="16" cy="6" r="2" fill="#00A896" stroke="none"/>
    </g>

    <!-- Architectural Corner Hatching & Carved Petal Details (Oyma naxış detalları) -->
    <g stroke="url(#brickGold)" stroke-width="1.2" opacity="0.6">
      <!-- 8 Petal Arcs -->
      <circle cx="0" cy="-125" r="18" fill="none"/>
      <circle cx="125" cy="0" r="18" fill="none"/>
      <circle cx="0" cy="125" r="18" fill="none"/>
      <circle cx="-125" cy="0" r="18" fill="none"/>
      <circle cx="88" cy="-88" r="18" fill="none"/>
      <circle cx="88" cy="88" r="18" fill="none"/>
      <circle cx="-88" cy="88" r="18" fill="none"/>
      <circle cx="-88" cy="-88" r="18" fill="none"/>
    </g>
  </g>
</svg>

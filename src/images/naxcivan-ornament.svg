<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!-- Naxçıvan Möminə Xatun türbəsi ornamenti - Səkkizguşəli ulduz naxışı -->
  <defs>
    <pattern id="naxPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Səkkizguşəli ulduz (8-pointed star) -->
      <polygon points="50,8 56,28 72,15 62,34 82,34 65,44 78,62 58,54 50,72 42,54 22,62 35,44 18,34 38,34 28,15 44,28" 
        stroke="#B99755" stroke-width="0.7" fill="none" opacity="0.6"/>
      <!-- Daxili dairə -->
      <circle cx="50" cy="40" r="14" stroke="#B99755" stroke-width="0.4" fill="none" opacity="0.4"/>
      <!-- Xarici çərçivə xətləri -->
      <line x1="0" y1="0" x2="18" y2="18" stroke="#B99755" stroke-width="0.35" opacity="0.3"/>
      <line x1="100" y1="0" x2="82" y2="18" stroke="#B99755" stroke-width="0.35" opacity="0.3"/>
      <line x1="0" y1="100" x2="18" y2="82" stroke="#B99755" stroke-width="0.35" opacity="0.3"/>
      <line x1="100" y1="100" x2="82" y2="82" stroke="#B99755" stroke-width="0.35" opacity="0.3"/>
      <!-- Kiçik daxili naxışlar -->
      <rect x="42" y="32" width="16" height="16" stroke="#B99755" stroke-width="0.3" fill="none" opacity="0.3" transform="rotate(45,50,40)"/>
      <!-- Künc bəzəkləri -->
      <path d="M0,50 Q12,38 25,50 Q12,62 0,50" stroke="#B99755" stroke-width="0.3" fill="none" opacity="0.35"/>
      <path d="M100,50 Q88,38 75,50 Q88,62 100,50" stroke="#B99755" stroke-width="0.3" fill="none" opacity="0.35"/>
      <path d="M50,0 Q38,12 50,25 Q62,12 50,0" stroke="#B99755" stroke-width="0.3" fill="none" opacity="0.35"/>
      <path d="M50,100 Q38,88 50,75 Q62,88 50,100" stroke="#B99755" stroke-width="0.3" fill="none" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#naxPattern)"/>
</svg>
